<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>蘑菇团子电子宠物</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#e65c5c">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif}
body{
  background:#f0f8ff;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px 16px;
}
.title{
  font-size:22px;
  color:#d84444;
  margin-bottom:16px;
  font-weight:bold;
}
.pet-wrap{
  width:280px;
  height:280px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:16px;
}
#petImg{
  width:240px;
  height:240px;
  object-fit:contain;
  transition: all 0.3s ease;
}
.info-box{
  width:100%;
  max-width:320px;
  background:#fff;
  border-radius:16px;
  padding:16px;
  box-shadow:0 2px 10px #f2d6d6;
  margin-bottom:16px;
}
.row{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
  font-size:15px;
  color:#333;
}
.bar-bg{
  width:120px;
  height:12px;
  background:#f7e8e8;
  border-radius:6px;
  overflow:hidden;
}
.bar-fill{
  height:100%;
  border-radius:6px;
  transition:width 0.4s;
}
.hunger .bar-fill{background:#ffb766}
.mood .bar-fill{background:#74c7ff}
.exp .bar-fill{background:#a48aff}
.btn-group{
  display:flex;
  gap:12px;
  margin-top:8px;
}
.btn-group-row{
  display:flex;
  gap:12px;
  margin-top:8px;
}
button{
  flex:1;
  border:none;
  background:#e65c5c;
  color:white;
  padding:12px;
  border-radius:12px;
  font-size:15px;
}
button:active{background:#c43c3c}
.btn-gray{
  background:#888;
}
.btn-gray:active{background:#666}
.tip{
  margin-top:12px;
  font-size:13px;
  color:#777;
  text-align:center;
}
/* 弹窗通用样式 */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:99;
  padding:16px;
}
.modal-content{
  background:#fff;
  padding:24px;
  border-radius:16px;
  text-align:center;
  max-width:320px;
  width:100%;
}
.modal-content p{
  margin:10px 0 16px;
  line-height:1.6;
  text-align:left;
}
.modal-btn-wrap{
  display:flex;
  gap:10px;
}
/* 点击团子抖动动画 */
@keyframes shake {
  0%,100%{transform:rotate(0deg)}
  25%{transform:rotate(-4deg)}
  75%{transform:rotate(4deg)}
}
.shake{
  animation: shake 0.3s ease-in-out;
}
input[type="file"]{
  display:none;
}
.label-file{
  display:block;
  background:#e65c5c;
  color:#fff;
  padding:10px;
  border-radius:10px;
  margin:8px 0;
  cursor:pointer;
}
.check-wrap{
  text-align:left;
  margin:10px 0;
}
</style>
</head>
<body>
<div class="title">🍄 蘑菇团子</div>
<div class="pet-wrap">
  <img id="petImg" alt="蘑菇团子" onclick="petClick()">
</div>

<div class="info-box">
  <div class="row">等级：<span id="level">1</span></div>
  <div class="row exp">
    <span>经验</span>
    <div class="bar-bg"><div class="bar-fill" id="expBar" style="width:0%"></div></div>
  </div>
  <div class="row hunger">
    <span>饱食度</span>
    <div class="bar-bg"><div class="bar-fill" id="hungerBar" style="width:80%"></div></div>
  </div>
  <div class="row mood">
    <span>心情</span>
    <div class="bar-bg"><div class="bar-fill" id="moodBar" style="width:80%"></div></div>
  </div>
  <div class="btn-group">
    <button onclick="feed()">🍚喂食</button>
    <button onclick="pet()">🤲抚摸</button>
  </div>
  <div class="btn-group-row">
    <button onclick="openSaveModal()">💾存档</button>
    <button onclick="resetPet()" class="btn-gray">🔄重置</button>
  </div>
  <div class="tip"><span id="statusText">乖乖待着哦~</span></div>
</div>

<!-- 升级弹窗 -->
<div class="modal" id="levelUpModal">
  <div class="modal-content">
    <h3>🎉升级啦！</h3>
    <p>蘑菇团子等级提升</p>
    <button onclick="closeLevelModal()">知道啦</button>
  </div>
</div>

<!-- 存档弹窗 -->
<div class="modal" id="saveModal">
  <div class="modal-content">
    <h3>存档管理</h3>
    <p>导出存档可以备份进度，换手机后导入恢复</p>
    <button onclick="exportSave()">📥导出存档</button>
    <label class="label-file">
      📤导入存档
      <input type="file" id="fileInput" accept=".json">
    </label>
    <div class="modal-btn-wrap">
      <button onclick="closeSaveModal()" class="btn-gray">关闭</button>
    </div>
  </div>
</div>

<!-- 新手引导弹窗 -->
<div class="modal" id="guideModal">
  <div class="modal-content">
    <h3>🍄欢迎来到蘑菇团子</h3>
    <p>✅ 喂食：增加饱食度，团子不会饿肚子<br>✅ 抚摸：提升团子心情<br>⚠️ 饱食、心情会随时间慢慢下降<br>💡 闲置一段时间，团子会自己睡觉休息<br>💾 记得定期【存档备份】防止进度丢失</p>
    <div class="check-wrap">
      <input type="checkbox" id="noMoreGuide">
      <label for="noMoreGuide">不再弹出此引导</label>
    </div>
    <button onclick="closeGuideModal()">开始照料</button>
  </div>
</div>

<script>
// 注册Service Worker（开启PWA离线）
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./service-worker.js");
}

const imgList = {
  normal: "./normal.png",
  happy: "./happy.png",
  hungry: "./hungry.png",
  sad: "./sad.png",
  sleep: "./sleep.png",
  play: "./play.png"
};

// 默认初始数据
const defaultData = {
  level:1,
  exp:0,
  expNeed:100,
  hunger:80,
  mood:80,
  lastActive:Date.now(),
  isPlaying: false
};

// ===== 数据容错读取 =====
function loadData(){
  let raw = localStorage.getItem('mushroomPetData');
  let data;
  if(!raw){
    data = {...defaultData};
    saveData(data);
    return data;
  }
  try{
    data = JSON.parse(raw);
    // 校验必要字段，缺失则重置
    const keys = ["level","exp","expNeed","hunger","mood","lastActive","isPlaying"];
    for(let k of keys){
      if(!(k in data)) throw new Error("字段缺失");
    }
  }catch(e){
    alert("存档数据损坏，已为你重置一只全新蘑菇团子");
    data = {...defaultData};
    saveData(data);
  }
  return data;
}
function saveData(data){
  localStorage.setItem('mushroomPetData', JSON.stringify(data));
}
let data = loadData();

const petImg = document.getElementById('petImg');
const levelEl = document.getElementById('level');
const expBar = document.getElementById('expBar');
const hungerBar = document.getElementById('hungerBar');
const moodBar = document.getElementById('moodBar');
const statusText = document.getElementById('statusText');
const levelUpModal = document.getElementById('levelUpModal');
const saveModal = document.getElementById('saveModal');
const guideModal = document.getElementById('guideModal');
const fileInput = document.getElementById('fileInput');

// ===== 新手引导逻辑 =====
function checkGuide(){
  const hide = localStorage.getItem("hideGuide");
  if(hide !== "1"){
    guideModal.style.display = "flex";
  }
}
function closeGuideModal(){
  const ck = document.getElementById("noMoreGuide");
  if(ck.checked){
    localStorage.setItem("hideGuide","1");
  }
  guideModal.style.display = "none";
}

// ===== 存档导出导入 =====
function openSaveModal(){
  saveModal.style.display = "flex";
}
function closeSaveModal(){
  saveModal.style.display = "none";
}
function exportSave(){
  const str = JSON.stringify(data,null,2);
  const blob = new Blob([str], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "mushroom-save.json";
  a.click();
  URL.revokeObjectURL(url);
}
fileInput.onchange = function(e){
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const imported = JSON.parse(ev.target.result);
      // 简单校验导入存档
      const keys = ["level","exp","expNeed","hunger","mood","lastActive","isPlaying"];
      for(let k of keys){
        if(!(k in imported)) throw new Error("存档格式不对");
      }
      data = imported;
      saveData(data);
      render();
      alert("✅ 存档导入成功！");
      closeSaveModal();
    }catch(err){
      alert("❌ 存档文件无效，导入失败");
    }
  }
  reader.readAsText(f);
  fileInput.value = "";
}

// 点击团子抖动
function petClick(){
  petImg.classList.add('shake');
  setTimeout(()=>petImg.classList.remove('shake'),300);
}

// 自动衰减饱食、心情
function autoDecay(){
  const gap = (Date.now() - data.lastActive)/1000;
  const sub = Math.floor(gap / 30);
  data.hunger = Math.max(0, data.hunger - sub);
  data.mood = Math.max(0, data.mood - sub);
  data.lastActive = Date.now();
  saveData(data);
  render();
}

// 状态判断逻辑
function checkState() {
  if (data.isPlaying) {
    petImg.src = imgList.play;
    statusText.innerText = "玩得好开心！🥰";
  } else if (data.hunger <= 15 || data.mood <= 15) {
    petImg.src = imgList.sad;
    statusText.innerText = "呜呜，快来陪陪我";
  } else if (data.hunger <= 30) {
    petImg.src = imgList.hungry;
    statusText.innerText = "肚子咕咕叫啦";
  } else if (data.mood >= 85) {
    petImg.src = imgList.happy;
    statusText.innerText = "超开心！🥳";
  } else if (data.hunger >= 75 && data.mood >= 75 && (Date.now() - data.lastActive) > 60000) {
    petImg.src = imgList.sleep;
    statusText.innerText = "呼呼睡觉中💤";
  } else {
    petImg.src = imgList.normal;
    statusText.innerText = "乖乖待着哦~";
  }
}

function render(){
  levelEl.innerText = data.level;
  expBar.style.width = (data.exp / data.expNeed *100)+"%";
  hungerBar.style.width = data.hunger+"%";
  moodBar.style.width = data.mood+"%";
  checkState();
}

// 喂食
function feed(){
  data.hunger = Math.min(100, data.hunger + 20);
  addExp(15);
  data.lastActive = Date.now();
  saveData(data);
  render();
}

// 抚摸：触发play状态2秒
function pet(){
  data.mood = Math.min(100, data.mood + 22);
  addExp(12);
  data.lastActive = Date.now();
  data.isPlaying = true;
  saveData(data);
  render();
  setTimeout(() => {
    data.isPlaying = false;
    saveData(data);
    render();
  }, 2000);
}

// 升级逻辑
function addExp(num){
  data.exp += num;
  if(data.exp >= data.expNeed){
    data.exp -= data.expNeed;
    data.level +=1;
    data.expNeed = Math.floor(data.expNeed *1.35);
    levelUpModal.style.display="flex";
  }
  saveData(data);
}
function closeLevelModal(){
  levelUpModal.style.display="none";
}
// 重置宠物
function resetPet(){
  if(confirm("确定重置蘑菇团子？所有等级进度清空！")){
    data = {...defaultData};
    saveData(data);
    render();
  }
}

// 初始化
checkGuide();
render();
setInterval(autoDecay, 5000);
</script>
</body>
</html>
