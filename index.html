<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>蘑菇团子电子宠物</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#e65c5c">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif}
body{
  background:#f0f8ff;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px 16px;
}
.title{
  font-size:22px;
  color:#d84444;
  margin-bottom:8px;
  font-weight:bold;
}
.version-text{
  font-size:12px;
  color:#888;
  margin-bottom:16px;
}
.pet-wrap{
  width:280px;
  height:280px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:16px;
}
#petImg{
  width:240px;
  height:240px;
  object-fit:contain;
  transition: transform 0.25s ease;
}
/* 团子动画 */
@keyframes bounce {
  0%,100%{transform: translateY(0)}
  50%{transform: translateY(-18px)}
}
@keyframes chew {
  0%,100%{transform: scale(1)}
  50%{transform: scale(1.12)}
}
@keyframes shyShake {
  0%,100%{transform: rotate(0deg)}
  25%{transform: rotate(-3deg)}
  75%{transform: rotate(3deg)}
}
.bounce-anim{
  animation: bounce 0.45s ease-in-out;
}
.chew-anim{
  animation: chew 0.35s ease-in-out;
}
.shy-anim{
  animation: shyShake 0.4s ease-in-out;
}
.info-box{
  width:100%;
  max-width:320px;
  background:#fff;
  border-radius:16px;
  padding:16px;
  box-shadow:0 2px 10px #f2d6d6;
  margin-bottom:16px;
}
.row{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
  font-size:15px;
  color:#333;
}
.bar-bg{
  width:120px;
  height:12px;
  background:#f7e8e8;
  border-radius:6px;
  overflow:hidden;
}
.bar-fill{
  height:100%;
  border-radius:6px;
  transition:width 0.4s;
}
.hunger .bar-fill{background:#ffb766}
.mood .bar-fill{background:#74c7ff}
.exp .bar-fill{background:#a48aff}
.btn-group{
  display:flex;
  gap:12px;
  margin-top:8px;
}
.btn-group-row{
  display:flex;
  gap:12px;
  margin-top:8px;
}
button{
  flex:1;
  border:none;
  background:#e65c5c;
  color:white;
  padding:12px;
  border-radius:12px;
  font-size:15px;
}
button:active{background:#c43c3c}
.btn-gray{
  background:#888;
}
.btn-gray:active{background:#666}
.tip{
  margin-top:12px;
  font-size:13px;
  color:#777;
  text-align:center;
}
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:99;
  padding:16px;
}
.modal-content{
  background:#fff;
  padding:24px;
  border-radius:16px;
  text-align:center;
  max-width:320px;
  width:100%;
}
.modal-content p{
  margin:10px 0 16px;
  line-height:1.6;
  text-align:left;
}
.modal-btn-wrap{
  display:flex;
  gap:10px;
}
.backpack-grid{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:10px;
  margin:12px 0;
}
.item-card{
  border:1px solid #ddd;
  border-radius:10px;
  padding:10px 6px;
}
.item-name{font-size:14px;font-weight:bold}
.item-desc{font-size:11px;color:#666;margin:4px 0}
.item-num{font-size:13px;color:#d84444}
.claim-info{
  margin:10px 0;
  padding:8px;
  background:#f8f8f8;
  border-radius:8px;
  font-size:14px;
}
input[type="file"]{
  display:none;
}
.label-file{
  display:block;
  background:#e65c5c;
  color:#fff;
  padding:10px;
  border-radius:10px;
  margin:8px 0;
  cursor:pointer;
}
.check-wrap{
  text-align:left;
  margin:10px 0;
}
</style>
</head>
<body>
<div class="title">🍄 蘑菇团子</div>
<div class="version-text">版本 v<span id="verShow">1.4</span></div>
<div class="pet-wrap">
  <img id="petImg" alt="蘑菇团子" onclick="petClick()">
</div>

<div class="info-box">
  <div class="row">等级：<span id="level">1</span></div>
  <div class="row exp">
    <span>经验</span>
    <div class="bar-bg"><div class="bar-fill" id="expBar" style="width:0%"></div></div>
  </div>
  <div class="row hunger">
    <span>饱食度</span>
    <div class="bar-bg"><div class="bar-fill" id="hungerBar" style="width:80%"></div></div>
  </div>
  <div class="row mood">
    <span>心情</span>
    <div class="bar-bg"><div class="bar-fill" id="moodBar" style="width:80%"></div></div>
  </div>
  <div class="btn-group">
    <button onclick="openBackpack()">🎒背包</button>
    <button onclick="pet()">🤲抚摸</button>
  </div>
  <div class="btn-group-row">
    <button onclick="openSaveModal()">💾存档</button>
    <button onclick="checkUpdate()">🔃检查更新</button>
    <button onclick="resetPet()" class="btn-gray">🔄重置</button>
  </div>
  <div class="tip"><span id="statusText">乖乖待着哦~</span></div>
</div>

<!-- 升级弹窗 -->
<div class="modal" id="levelUpModal">
  <div class="modal-content">
    <h3>🎉升级啦！</h3>
    <p>蘑菇团子等级提升</p>
    <button onclick="closeLevelModal()">知道啦</button>
  </div>
</div>

<!-- 背包弹窗 -->
<div class="modal" id="backpackModal">
  <div class="modal-content">
    <h3>🎒食物背包</h3>
    <div class="claim-info">
      <div>可领取口粮：<span id="canClaim">0</span> 份</div>
      <button onclick="claimGrain()" style="margin-top:6px">✅一键领取</button>
    </div>
    <div class="backpack-grid" id="backpackList"></div>
    <div class="modal-btn-wrap">
      <button onclick="closeBackpack()" class="btn-gray">关闭</button>
    </div>
  </div>
</div>

<!-- 存档弹窗 -->
<div class="modal" id="saveModal">
  <div class="modal-content">
    <h3>存档管理</h3>
    <p>导出存档可以备份进度，换手机后导入恢复</p>
    <button onclick="exportSave()">📥导出存档</button>
    <label class="label-file">
      📤导入存档
      <input type="file" id="fileInput" accept=".json">
    </label>
    <div class="modal-btn-wrap">
      <button onclick="closeSaveModal()" class="btn-gray">关闭</button>
    </div>
  </div>
</div>

<!-- 新手引导弹窗 -->
<div class="modal" id="guideModal">
  <div class="modal-content">
    <h3>🍄欢迎来到蘑菇团子</h3>
    <p>✅ 打开背包选择食物投喂团子<br>✅ 口粮每60秒自动产出一份，记得领取<br>✅ 多点抚摸团子，它会开心蹦跳<br>✅ 饱食、心情会随时间慢慢下降<br>💾 记得定期【存档备份】防止进度丢失</p>
    <div class="check-wrap">
      <input type="checkbox" id="noMoreGuide">
      <label for="noMoreGuide">不再弹出此引导</label>
    </div>
    <button onclick="closeGuideModal()">开始照料</button>
  </div>
</div>

<script>
const APP_VERSION = {
  major: 1,
  minor: 4
};
document.getElementById("verShow").innerText = `${APP_VERSION.major}.${APP_VERSION.minor}`;
const SW_TAG = APP_VERSION.major;
const FOOD_CONFIG = [
  {id:"grain", name:"口粮", desc:"饱食+20，经验+15", addHunger:20, addMood:0, addExp:15},
  {id:"cookie", name:"小饼干", desc:"饱食+12，心情+30，经验+10", addHunger:12, addMood:30, addExp:10},
  {id:"fruit", name:"水果", desc:"饱食+16，心情+15，经验+20", addHunger:16, addMood:15, addExp:20},
];
const GRAIN_INTERVAL = 60 * 1000;
let newWorker = null;
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register(`./service-worker.js?v=${SW_TAG}`).then(reg => {
    reg.addEventListener('updatefound', () => {
      newWorker = reg.installing;
      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'waiting') {
          if (confirm("🍄发现大版本更新，将刷新全部资源，确定更新？")) {
            newWorker.postMessage({ type: 'SKIP_WAITING' });
          }
        }
      })
    })
  });
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    window.location.reload();
  });
}
function checkUpdate() {
  navigator.serviceWorker.getRegistration().then(reg => {
    if (!reg) {
      alert("当前环境不支持PWA更新");
      return;
    }
    reg.update();
    alert("✅ 已检查，当前已是最新版本（小修改刷新页面即可加载）");
  })
}
const defaultData = {
  level:1,
  exp:0,
  expNeed:100,
  hunger:80,
  mood:80,
  lastActive:Date.now(),
  isPlaying: false,
  bag:{
    grain:5,
    cookie:3,
    fruit:3
  },
  foodTimer: Date.now(),
  petTouchCount: 0,
  lastTouchTime: 0
};
function saveData(data){
  localStorage.setItem('mushroomPetData', JSON.stringify(data));
}
function loadData(){
  let raw = localStorage.getItem('mushroomPetData');
  let data;
  if(!raw){
    data = JSON.parse(JSON.stringify(defaultData));
    saveData(data);
    return data;
  }
  try{
    data = JSON.parse(raw);
    const keys = ["level","exp","expNeed","hunger","mood","lastActive","isPlaying","bag","foodTimer","petTouchCount","lastTouchTime"];
    for(let k of keys){
      if(!(k in data)) throw new Error("字段缺失");
    }
    if(!data.bag) data.bag = JSON.parse(JSON.stringify(defaultData.bag));
    if(typeof data.foodTimer !== "number") data.foodTimer = Date.now();
  }catch(e){
    alert("存档数据损坏，已为你重置一只全新蘑菇团子");
    data = JSON.parse(JSON.stringify(defaultData));
    saveData(data);
  }
  return data;
}
let data = loadData();
const petImg = document.getElementById('petImg');
const levelEl = document.getElementById('level');
const expBar = document.getElementById('expBar');
const hungerBar = document.getElementById('hungerBar');
const moodBar = document.getElementById('moodBar');
const statusText = document.getElementById('statusText');
const levelUpModal = document.getElementById('levelUpModal');
const backpackModal = document.getElementById('backpackModal');
const backpackList = document.getElementById('backpackList');
const canClaimEl = document.getElementById("canClaim");
const saveModal = document.getElementById('saveModal');
const guideModal = document.getElementById('guideModal');
const fileInput = document.getElementById('fileInput');
let animLock = false;

// 抚摸触发蹦跳动画
function petClick(){
  if(animLock) return;
  const now = Date.now();
  const touchGap = now - data.lastTouchTime;
  // 2秒内连续抚摸计数
  if(touchGap < 2000){
    data.petTouchCount += 1;
  }else{
    data.petTouchCount = 1;
  }
  data.lastTouchTime = now;
  saveData(data);
  animLock = true;
  if(data.petTouchCount >=3){
    // 连续抚摸3次，开心蹦跳
    petImg.classList.add("bounce-anim");
    setTimeout(()=>{
      petImg.classList.remove("bounce-anim");
      animLock = false;
    },450);
    data.petTouchCount = 0;
  }else{
    petImg.classList.add("shy-anim");
    setTimeout(()=>{
      petImg.classList.remove("shy-anim");
      animLock = false;
    },400);
  }
}
// 投喂咀嚼动画
function feedAnim(){
  if(animLock) return;
  animLock = true;
  petImg.classList.add("chew-anim");
  setTimeout(()=>{
    petImg.classList.remove("chew-anim");
    animLock = false;
  },350);
}
function calcCanClaim(){
  const now = Date.now();
  const diff = now - data.foodTimer;
  const count = Math.floor(diff / GRAIN_INTERVAL);
  return count;
}
function updateClaimText(){
  canClaimEl.innerText = calcCanClaim();
}
function claimGrain(){
  const cnt = calcCanClaim();
  if(cnt <= 0){
    alert("暂时还没有口粮可以领取，再等等哦~");
    return;
  }
  data.bag.grain += cnt;
  const now = Date.now();
  const diff = now - data.foodTimer;
  const remainTime = diff % GRAIN_INTERVAL;
  data.foodTimer = now - remainTime;
  saveData(data);
  renderBackpack();
  updateClaimText();
  alert(`✅ 领取成功！+${cnt}份口粮`);
}
function renderBackpack(){
  updateClaimText();
  backpackList.innerHTML = "";
  FOOD_CONFIG.forEach(food=>{
    const div = document.createElement("div");
    div.className = "item-card";
    div.innerHTML = `
      <div class="item-name">${food.name}</div>
      <div class="item-desc">${food.desc}</div>
      <div class="item-num">数量：${data.bag[food.id]}</div>
    `;
    if(data.bag[food.id]>0){
      div.onclick = ()=>feedWithFood(food);
    }else{
      div.style.opacity="0.4";
    }
    backpackList.appendChild(div);
  })
}
function openBackpack(){
  renderBackpack();
  backpackModal.style.display="flex";
}
function closeBackpack(){
  backpackModal.style.display="none";
}
function feedWithFood(food){
  if(data.bag[food.id] <= 0) return;
  feedAnim();
  data.bag[food.id]--;
  data.hunger = Math.min(100, data.hunger + food.addHunger);
  data.mood = Math.min(100, data.mood + food.addMood);
  addExp(food.addExp);
  data.lastActive = Date.now();
  saveData(data);
  render();
  renderBackpack();
  closeBackpack();
}
function checkGuide(){
  const hide = localStorage.getItem("hideGuide");
  if(hide !== "1"){
    guideModal.style.display = "flex";
  }
}
function closeGuideModal(){
  const ck = document.getElementById("noMoreGuide");
  if(ck.checked){
    localStorage.setItem("hideGuide","1");
  }
  guideModal.style.display = "none";
}
function openSaveModal(){
  saveModal.style.display = "flex";
}
function closeSaveModal(){
  saveModal.style.display = "none";
}
function exportSave(){
  const str = JSON.stringify(data,null,2);
  const blob = new Blob([str], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "mushroom-save.json";
  a.click();
  URL.revokeObjectURL(url);
}
fileInput.onchange = function(e){
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const imported = JSON.parse(ev.target.result);
      const keys = ["level","exp","expNeed","hunger","mood","lastActive","isPlaying","bag","foodTimer","petTouchCount","lastTouchTime"];
      for(let k of keys){
        if(!(k in imported)) throw new Error("存档格式不对");
      }
      data = imported;
      saveData(data);
      render();
      alert("✅ 存档导入成功！");
      closeSaveModal();
    }catch(err){
      alert("❌ 存档文件无效，导入失败");
    }
  }
  reader.readAsText(f);
  fileInput.value = "";
}
function pet(){
  petClick();
}
function autoDecay(){
  const gap = (Date.now() - data.lastActive)/1000;
  const sub = Math.floor(gap / 30);
  data.hunger = Math.max(0, data.hunger - sub);
  data.mood = Math.max(0, data.mood - sub);
  data.lastActive = Date.now();
  saveData(data);
  render();
}
function checkState() {
  if (data.isPlaying) {
    petImg.src = "./play.png";
    statusText.innerText = "玩得好开心！🥰";
  } else if (data.hunger <= 15 || data.mood <= 15) {
    petImg.src = "./sad.png";
    statusText.innerText = "呜呜，快来陪陪我";
  } else if (data.hunger <= 30) {
    petImg.src = "./hungry.png";
    statusText.innerText = "肚子咕咕叫啦";
  } else if (data.mood >= 85) {
    petImg.src = "./happy.png";
    statusText.innerText = "超开心！🥳";
  } else if (data.mood < 30 && data.hunger > 40) {
    petImg.src = "./shy.png";
    statusText.innerText = "有点害羞啦 😳";
  } else if (data.hunger >= 70 && data.mood >= 40 && (Date.now() - data.lastActive) > 80000) {
    petImg.src = "./bored.png";
    statusText.innerText = "有点无聊，陪陪我吧";
  } else if (data.hunger >= 75 && data.mood >= 75 && (Date.now() - data.lastActive) > 60000) {
    petImg.src = "./sleep.png";
    statusText.innerText = "呼呼睡觉中💤";
  } else {
    petImg.src = "./normal.png";
    statusText.innerText = "乖乖待着哦~";
  }
}
function render(){
  levelEl.innerText = data.level;
  expBar.style.width = (data.exp / data.expNeed *100)+"%";
  hungerBar.style.width = data.hunger+"%";
  moodBar.style.width = data.mood+"%";
  checkState();
}
function addExp(num){
  data.exp += num;
  if(data.exp >= data.expNeed){
    data.exp -= data.expNeed;
    data.level +=1;
    data.expNeed = Math.floor(data.expNeed *1.35);
    levelUpModal.style.display="flex";
  }
  saveData(data);
}
function closeLevelModal(){
  levelUpModal.style.display="none";
}
function resetPet(){
  if(confirm("确定重置蘑菇团子？所有等级、背包物品、计时全部清空！")){
    data = JSON.parse(JSON.stringify(defaultData));
    saveData(data);
    render();
  }
}
checkGuide();
render();
setInterval(autoDecay, 5000);
</script>
</body>
</html>
