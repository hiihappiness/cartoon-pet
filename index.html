<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title id="docTitle">蘑菇团子电子宠物</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#e65c5c">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif}
body{
  background:#f0f8ff;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px 16px;
  transition: background 1s;
}
body.night{
  background:#222638;
}
.title{
  font-size:22px;
  color:#d84444;
  margin-bottom:8px;
  font-weight:bold;
}
.version-text{
  font-size:12px;
  color:#888;
  margin-bottom:8px;
}
.pet-wrap{
  width:280px;
  height:280px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:16px;
  position:relative;
}
/* 对话气泡 */
.talk-bubble{
  position:absolute;
  top:-20px;
  left:50%;
  transform: translateX(-50%);
  background:#fff;
  padding:6px 10px;
  border-radius:12px;
  font-size:14px;
  color:#333;
  box-shadow:0 2px 6px rgba(0,0,0,0.15);
  opacity:0;
  transition: opacity 0.6s;
  pointer-events:none;
  z-index:10;
  max-width:160px;
  text-align:center;
}
#petImg{
  width:240px;
  height:240px;
  object-fit:contain;
  transition: transform 0.25s ease;
}
.pet-fallback{
  position:absolute;
  font-size:120px;
  display:none;
}
#petImg.error + .pet-fallback{
  display:block;
}
/* 团子动画 */
@keyframes bounce {
  0%,100%{transform: translateY(0)}
  50%{transform: translateY(-18px)}
}
@keyframes chew {
  0%,100%{transform: scale(1)}
  50%{transform: scale(1.12)}
}
@keyframes shyShake {
  0%,100%{transform: rotate(0deg)}
  25%{transform: rotate(-3deg)}
  75%{transform: rotate(3deg)}
}
.bounce-anim{
  animation: bounce 0.45s ease-in-out;
}
.chew-anim{
  animation: chew 0.35s ease-in-out;
}
.shy-anim{
  animation: shyShake 0.4s ease-in-out;
}
.info-box{
  width:100%;
  max-width:320px;
  background:#fff;
  border-radius:16px;
  padding:16px;
  box-shadow:0 2px 10px #f2d6d6;
  margin-bottom:16px;
  transition: background 1s;
}
body.night .info-box{
  background:#2f344c;
}
.row{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
  font-size:15px;
  color:#333;
}
body.night .row{
  color:#eee;
}
.bar-bg{
  width:120px;
  height:12px;
  background:#f7e8e8;
  border-radius:6px;
  overflow:hidden;
}
.bar-fill{
  height:100%;
  border-radius:6px;
  transition:width 0.4s;
}
.hunger .bar-fill{background:#ffb766}
.mood .bar-fill{background:#74c7ff}
.exp .bar-fill{background:#a48aff}
.tip-row{
  margin:6px 0;
  font-size:12px;
  color:#996622;
  text-align:center;
}
body.night .tip-row{
  color:#ffdd88;
}
.buff-tip{
  margin:4px 0;
  font-size:12px;
  color:#9b59b6;
  text-align:center;
  display:none;
}
.btn-group{
  display:flex;
  gap:8px;
  margin-top:8px;
}
.btn-group-row{
  display:flex;
  gap:8px;
  margin-top:8px;
}
button{
  flex:1;
  border:none;
  background:#e65c5c;
  color:white;
  padding:10px 6px;
  border-radius:12px;
  font-size:14px;
}
button:active{background:#c43c3c}
.btn-gray{
  background:#888;
}
.btn-gray:active{background:#666}
.tip{
  margin-top:12px;
  font-size:13px;
  color:#777;
  text-align:center;
}
body.night .tip{
  color:#bbb;
}
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:99;
  padding:16px;
}
.modal-content{
  background:#fff;
  padding:16px;
  border-radius:16px;
  text-align:center;
  max-width:320px;
  width:100%;
  transition: background 1s;
  max-height:85vh;
  overflow-y:auto;
}
body.night .modal-content{
  background:#2f344c;
}
body.night .modal-content p{
  color:#eee;
}
.modal-content p{
  margin:10px 0 16px;
  line-height:1.6;
  text-align:left;
}
.modal-btn-wrap{
  display:flex;
  gap:10px;
  margin-top:10px;
}
/* ===== 背包标签样式 修复button原生样式 ===== */
.bp-tab-wrap{
  display:flex;
  gap:4px;
  margin:8px 0 12px;
}
.bp-tab{
  flex:1;
  padding:6px 2px;
  font-size:13px;
  background:#eee;
  color:#333;
  border:none;
  border-radius:6px;
  -webkit-appearance: none;
  appearance: none;
}
body.night .bp-tab{
  background:#444a64;
  color:#eef;
}
.bp-tab.active{
  background:#e65c5c;
  color:#fff;
}
.bp-items-wrap{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:8px;
}
.item-card{
  border:1px solid #ddd;
  border-radius:10px;
  padding:10px 4px;
  cursor:pointer;
  transition:0.2s;
  position:relative;
}
body.night .item-card{
  border-color:#555a75;
  background:#383d56;
}
.item-card:hover{
  transform: translateY(-2px);
  box-shadow:0 2px 6px rgba(0,0,0,0.12);
}
.item-card.can-use{
  border-color:#ff9999;
  background:#fff7f7;
}
body.night .item-card.can-use{
  border-color:#994444;
  background:#423240;
}
.item-card.disabled{
  opacity:0.45;
  cursor:not-allowed;
}
.item-name{font-size:12px;font-weight:bold;line-height:1.2}
.item-num{font-size:13px;color:#d84444;font-weight:bold;margin-top:2px;}
.item-tooltip{
  display:none;
  position:absolute;
  bottom:110%;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:#fff;
  font-size:11px;
  padding:4px 6px;
  border-radius:4px;
  white-space:nowrap;
  z-index:10;
}
body.night .item-tooltip{
  background:#eeeeee;
  color:#111111;
}
.item-card:hover .item-tooltip{
  display:block;
}
.claim-info{
  margin:6px 0;
  padding:6px;
  background:#f8f8f8;
  border-radius:8px;
  font-size:13px;
}
body.night .claim-info{
  background:#404660;
  color:#eee;
}
/* 游戏弹窗 */
.game-area{
  width:100%;
  height:240px;
  background:#e8f4ff;
  border-radius:12px;
  position:relative;
  overflow:hidden;
  margin:8px 0;
}
body.night .game-area{
  background:#374160;
}
.bubble{
  width:44px;
  height:44px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #ffffff, #73c8ff);
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  color:#2277bb;
  cursor:pointer;
  font-size:12px;
}
input[type="file"]{
  display:none;
}
.label-file{
  display:block;
  background:#e65c5c;
  color:#fff;
  padding:10px;
  border-radius:10px;
  margin:8px 0;
  cursor:pointer;
}
.check-wrap{
  text-align:left;
  margin:10px 0;
}
</style>
</head>
<body>
<div class="title" id="pageTitle">🍄 <span></span></div>
<div class="version-text">版本 v<span id="verShow">1.8</span></div>
<div class="pet-wrap">
  <div class="talk-bubble" id="talkBubble"></div>
  <img id="petImg" alt="蘑菇团子" onerror="this.classList.add('error')">
  <div class="pet-fallback">🍄</div>
</div>
<div class="info-box">
  <div class="row">等级：<span id="level">1</span>｜<button id="soundBtn" onclick="toggleSound()">🔊音效开</button></div>
  <div id="buffTip" class="buff-tip"></div>
  <div class="row exp">
    <span>经验</span>
    <div class="bar-bg"><div class="bar-fill" id="expBar" style="width:0%"></div></div>
  </div>
  <div class="row hunger">
    <span>饱食度</span>
    <div class="bar-bg"><div class="bar-fill" id="hungerBar" style="width:80%"></div></div>
  </div>
  <div class="row mood">
    <span>心情</span>
    <div class="bar-bg"><div class="bar-fill" id="moodBar" style="width:80%"></div></div>
  </div>
  <div class="btn-group">
    <button onclick="openBackpack()">🎒背包</button>
    <button onclick="pet()">🤲抚摸</button>
    <button onclick="renamePet()">✏改名</button>
  </div>
  <div class="btn-group-row">
    <button onclick="openGame()">🎮游戏</button>
    <button onclick="doSignIn()">📅签到</button>
    <button onclick="openSaveModal()">💾存档</button>
  </div>
  <div class="btn-group-row">
    <button onclick="checkUpdate()">🔃更新</button>
  </div>
  <div class="tip"><span id="statusText">乖乖待着哦~</span></div>
</div>
<!-- 升级弹窗【禁止遮罩点击关闭，必须点知道啦】 -->
<div class="modal" id="levelUpModal">
  <div class="modal-content">
    <h3>🎉升级啦！</h3>
    <p>蘑菇团子等级提升</p>
    <button onclick="closeLevelModal()">知道啦</button>
  </div>
</div>
<!-- 背包弹窗 点击遮罩关闭 -->
<div class="modal" id="backpackModal" onclick="modalMaskClose(event)">
  <div class="modal-content">
    <h3>🎒食物背包</h3>
    <div class="claim-info">
      <div>可领取宝箱：<span id="canClaim">0</span> / 99</div>
      <div id="boxNextTip" class="tip-row"></div>
      <button onclick="claimAllBox()" style="margin-top:6px">📦一键开启全部宝箱</button>
    </div>
    <div id="backpackList"></div>
    <div class="modal-btn-wrap">
      <button onclick="closeBackpack()" class="btn-gray">关闭</button>
    </div>
  </div>
</div>
<!-- 小游戏弹窗 点击遮罩关闭 -->
<div class="modal" id="gameModal" onclick="modalMaskClose(event)">
  <div class="modal-content">
    <h3>🎮泡泡小游戏</h3>
    <p id="gameTip">点击泡泡得分！限时30秒</p>
    <div class="game-area" id="gameArea"></div>
    <p>得分：<span id="gameScore">0</span>｜剩余：<span id="gameTimerText">30</span>秒</p>
    <div class="modal-btn-wrap">
      <button onclick="startGame()">开始游戏</button>
      <button onclick="closeGame()" class="btn-gray">关闭</button>
    </div>
  </div>
</div>
<!-- 存档弹窗 点击遮罩关闭 -->
<div class="modal" id="saveModal" onclick="modalMaskClose(event)">
  <div class="modal-content">
    <h3>存档管理</h3>
    <p>导出存档可以备份进度，换手机后导入恢复</p>
    <button onclick="exportSave()">📥导出存档</button>
    <label class="label-file">
      📤导入存档
      <input type="file" id="fileInput" accept=".json">
    </label>
    <div class="modal-btn-wrap">
      <button onclick="closeSaveModal()" class="btn-gray">关闭</button>
    </div>
  </div>
</div>
<!-- 新手引导弹窗 点击遮罩关闭 -->
<div class="modal" id="guideModal" onclick="modalMaskClose(event)">
  <div class="modal-content">
    <h3>🍄欢迎来到蘑菇团子</h3>
    <p>✅ 点击团子可以和它对话<br>✅ 投喂食物提升饱食和心情<br>✅ 夜晚团子会睡觉，消耗变慢<br>✅ 玩泡泡小游戏赢零食奖励<br>✅ 宝箱离线自动累计，上限99个<br>💾 记得定期【存档备份】防止进度丢失</p>
    <div class="check-wrap">
      <input type="checkbox" id="noMoreGuide">
      <label for="noMoreGuide">不再弹出此引导</label>
    </div>
    <button onclick="closeGuideModal()">开始照料</button>
  </div>
</div>
<script src="./pet.js"></script>
</body>
</html>
